[project]
name = "hf-msft-foundry"
version = "0.1.0"
description = "Deploy open models from the Hugging Face collection on Microsoft Foundry"
readme = "README.md"
authors = [
    { name = "Alvaro Bartolome", email = "36760800+alvarobartt@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "azure-identity>=1.25.1",
    "requests>=2.32.0",
]

[project.urls]
Homepage = "https://github.com/alvarobartt/hf-msft-foundry"
Repository = "https://github.com/alvarobartt/hf-msft-foundry"
Issues = "https://github.com/alvarobartt/hf-msft-foundry/issues"

[project.scripts]
hf-msft-foundry = "hf_msft_foundry.cli:main"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["uv_build>=0.9.5,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
lint = [
    "pre-commit>=4.5.1",
    "ruff>=0.14.10",
    "ty>=0.0.1a32",
    "types-requests>=2.32.0",
]
test = [
    "pytest>=8.4.0",
]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
